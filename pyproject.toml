[project]
name = "fractional-cascading-index"
version = "0.1.1"
description = "A layered set of sorted arrays sharing sampled elements between adjacent layers to answer multi-level binary searches in a single logarithmic pass."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
